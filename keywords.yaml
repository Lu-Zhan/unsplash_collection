# Unsplash 关键词配置 - Relighting Dataset
# 按图像标注 schema（D5 特殊光照）组织
# 用法：python batch_download.py [--d5 <类型>] [--dry-run]

meta:
  default_size: "regular"
  default_count: 50
  default_output: "./downloads"

# ─────────────────────────────────────────
# 人像专属光照（仅 d2=portrait 适用）
# ─────────────────────────────────────────
portrait_lighting:

  rembrandt:
    d5: rembrandt
    d2: portrait
    jobs:
      - query: "rembrandt lighting portrait"
        count: 50
      - query: "chiaroscuro portrait"
        count: 50
      - query: "dramatic portrait side lighting"
        count: 50

  butterfly:
    d5: butterfly
    d2: portrait
    jobs:
      - query: "butterfly lighting portrait"
        count: 30
      - query: "glamour portrait studio lighting"
        count: 50
      - query: "fashion portrait front lighting"
        count: 50

  split:
    d5: split
    d2: portrait
    jobs:
      - query: "split lighting portrait"
        count: 50
      - query: "half face shadow portrait"
        count: 50
      - query: "dramatic shadow face photography"
        count: 50

  flat:
    d5: flat
    d2: portrait
    jobs:
      - query: "soft light portrait studio"
        count: 50
      - query: "beauty dish portrait"
        count: 50
      - query: "diffused light portrait"
        count: 50

# ─────────────────────────────────────────
# 色彩驱动光照
# ─────────────────────────────────────────
color_lighting:

  cyberpunk_neon:
    d5: cyberpunk_neon
    jobs:
      - query: "neon light portrait"
        count: 80
        d2: portrait
      - query: "cyberpunk neon city"
        count: 80
        d2: architecture
      - query: "neon glow photography"
        count: 50
        d2: object
      - query: "neon light architecture"
        count: 50
        d2: architecture
      - query: "cyberpunk street photography"
        count: 50
        d2: no_dominant_subject

  teal_orange:
    d5: teal_orange
    jobs:
      - query: "teal orange portrait"
        count: 80
        d2: portrait
      - query: "cinematic teal orange"
        count: 80
        d2: no_dominant_subject
      - query: "golden hour teal"
        count: 50
        d2: no_dominant_subject

  moonlight_cool_mono:
    d5: moonlight_cool_mono
    jobs:
      - query: "moonlight portrait"
        count: 80
        d2: portrait
      - query: "cool blue light photography"
        count: 50
        d2: no_dominant_subject
      - query: "monochrome blue portrait"
        count: 50
        d2: portrait
      - query: "night portrait cold light"
        count: 50
        d2: portrait

